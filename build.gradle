import groovy.json.JsonSlurper
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.17'
}
def targets = new JsonSlurper().parse(file('versions.json'))
def mc = providers.gradleProperty('minecraft_version').getOrElse('1.21.1')
def target = targets.find { it.minecraft == mc }
if (target == null) throw new GradleException("Unsupported Minecraft version: ${mc}")
version = '1.1'
group = 'com.example.randomitem'
base.archivesName = "randomitem-${version}-forge-${mc}"
layout.buildDirectory = layout.projectDirectory.dir("build/${mc}")
java.toolchain.languageVersion = JavaLanguageVersion.of(target.java as int)
sourceSets.main {
    java.srcDirs = ['src/main/java', target.eventbus == 6 ? 'src/forge6/java' : 'src/forge7/java',
                    target.permissions == 'legacy' ? 'src/permissions-legacy/java' : 'src/permissions-modern/java',
                    mc == '26.3' ? 'src/drop-modern/java' : 'src/drop-legacy/java']
}
if (providers.gradleProperty('smokeTest').isPresent()) {
    sourceSets.main.java.srcDirs += ['src/smoke/java', target.eventbus == 6 ? 'src/smoke-forge6/java' : 'src/smoke-forge7/java']
}
minecraft {
    if (mc.startsWith('1.')) mappings channel: 'official', version: mc
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir("run/${mc}")
            systemProperty 'forge.enabledGameTestNamespaces', 'randomitem'
        }
        register('server') { args '--nogui' }
        register('gameTestServer')
    }
}
repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}
dependencies {
    implementation minecraft.dependency(mc, "net.minecraftforge:forge:${mc}-${target.forge}")
}
tasks.named('processResources', ProcessResources) {
    def replacements = [mod_version: version, minecraft_version: mc, forge_version: target.forge,
                        forge_major: target.forge.tokenize('.')[0]]
    inputs.properties replacements
    filesMatching('META-INF/mods.toml') { expand replacements }
    exclude 'pack.mcmeta'
}
tasks.named('jar', Jar) {
    exclude 'com/example/randomitem/Smoke*.class'
    archiveVersion = ''
    manifest.attributes('Implementation-Version': project.version)
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
